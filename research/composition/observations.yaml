research_version: "0.1"
method:
  evidence: Directly inspected decoded video frames. Visual observations are observed; beat_role/editorial_job
    and sequence abstractions explicitly inferred. Candidate normalization remains proposal.
  sampling: Purposeful genre/platform sampling, not random. Adjacent one-second probes in selected windows plus
    dispersed samples. No exhaustive full-video viewing claim.
  subject_count: Visible principal subjects, not always all background people. Zero can mean product-only,
    hands-only or a graphic.
  media_handling: No third-party screenshots/video/logo/audio committed. Only textual notes, URLs and content timecodes.
  unknowns: not_assessed/not_determined is intentional; no audio analysis or native UI safe-zone certification.
  typography: 12 existing frame observations re-inspected for visible glyph/stroke/outline features; exact font
    names unverified. Family hypotheses and impressions explicitly inferred, not audience-effect findings.
