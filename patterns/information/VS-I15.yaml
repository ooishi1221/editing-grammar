id: "VS-I15"
title: "商品同定・パックショット"
category: information
purpose:
  - "商品・パッケージを識別可能な主役として見せる"
goodFor:
  - "商品広告・レビュー・実演で、使用文脈から正確な商品同定へ切り替える場面"
  - "商品やパッケージ自体を視聴者に明確に識別させたい場面"
avoidWhen:
  - "商品は補助映像として一時的に見せるだけで、同定を主目的にしない場面"
  - "発信元・チャンネル識別やCTA・遷移先提示が主目的の場面"
tags:
  - product
  - package
  - pack-shot
implementation:
  recipe:
    - receive the exact supplied product identity and product asset
    - expose the supplied product or package as the item that must remain identifiable
    - preserve exact product/package identity rather than substituting a generic category visual
  parameters:
    productIdentity:
      kind: runtime-input
      description: Supplied identity of the exact product or package that must become identifiable.
      required: true
      valueType: string
    productAsset:
      kind: runtime-input
      description: Supplied asset or source identity representing the exact product or package.
      required: true
      valueType: string
