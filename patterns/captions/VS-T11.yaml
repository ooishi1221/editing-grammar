id: VS-T11
title: 語句強調
category: captions
purpose:
  - 文中の核を目立たせる
goodFor:
  - 一語または短い語句に注意を集める場面
avoidWhen:
  - 同一発話内で複数の語句を同じ強さで強調する場面
tags:
  - typography
  - visual
  - emphasis
visual:
  motion:
    type: scale
    trigger: keyword
    durationFrames: [6, 12]
    easing: easeOutCubic
    parameters:
      fromScale: 1.0
      peakScale: 1.12
implementation:
  recipe:
    - Mark the keyword within the caption token sequence.
    - Apply the scale motion only to the marked keyword.
  rendererCandidates:
    - remotion
    - hyperframes
